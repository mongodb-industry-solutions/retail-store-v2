<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; padding: 16px; font-family: -apple-system, sans-serif; text-align: center; }
    h3 { color: #00684a; margin: 0 0 8px; font-size: 14px; }
    p { font-size: 12px; color: #666; margin: 0 0 12px; }
    button { background: #00684a; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #005c42; }
  </style>
</head>
<body>
  <h3>🍃 Amazon Importer</h3>
  <p>Opens the import tool in a new tab</p>
  <button id="openBtn">Open Importer</button>
  <script>
    document.getElementById("openBtn").addEventListener("click", () => {
      chrome.tabs.create({ url: chrome.runtime.getURL("importer.html") });
      window.close();
    });
  </script>
</body>
</html>
