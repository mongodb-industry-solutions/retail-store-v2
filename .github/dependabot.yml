version: 2
updates:
  # Security patches - daily checks for vulnerabilities
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Regular updates - weekly, grouped
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group all patch updates together
      patch-updates:
        update-types: ["patch"]
      # Group all minor updates together  
      minor-updates:
        update-types: ["minor"]
      # Group all major updates together
      major-updates:
        update-types: ["major"]
